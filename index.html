<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSCard-Marketer</title>
    <link rel="icon" type="image/vnd.microsoft.icon" href="https://www.prumyslovkaliberec.cz/favicon.ico">
    <link rel="stylesheet" href="./style/main.css">
</head>

<body>
    <main class="main">
        <figure class="card card__marketer">
            <header>
                <p class="card__title">Marketer+</p>
                <p class="card__description"><span class="highlight highlight--primary">Pokročilé funkce</span> vhodné
                    zejména pro e-shopy. E-mailing založený na datech.</p>
                    <p class="card__description card__pricing"><span class="highlight highlight--primary highlight--large">200 Kč</span> měsíčně</p>
                    <p class="card__description card__pricing">nebo 300 Kč při <a href="#" class="highlight highlight--primary">měsíční platbě</a></p>
            </header>

            <section class="card__buy">
                <a href="#" class="button button--primary">Vyzkoušejte zdarma</a>
            </section>
            <section class="card__package">
                <ul class="list">
                    <li class="list list__includes highlight highlight--primary">Neomezené množství e-mailů</li>
                    <li class="list list__includes">Drag&drop editor na tvorbu šablon</li>
                    <li class="list list__includes">170+ designových šablon</li>
                    <li class="list list__includes">AI generování předmětu a úpravy textů</li>
                    <li class="list list__includes">Integrace s e-shopy</li>
                    <li class="list list__doesntInclude">Slevové kupóny</li>
                    <li class="list list__doesntInclude">Automatizace podle chování zákazníka</li>
                </ul>
            </section>
        </figure>
    </main>
</body>

</html>
