<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSCard-Marketer</title>
    <link rel="icon" type="image/vnd.microsoft.icon" href="https://www.prumyslovkaliberec.cz/favicon.ico">
    <link rel="stylesheet" href="./style2/main.css">
</head>

<body>
    <main class="main">
        <figure class="card card__marketer">
            <header>
                <p class="card__title">BUSINESS PRO</p>
                <p class="card__description">For serious business</p>
                <div class="card__table">
                    <p class="card__columns">5K <span class="column__description">INVOICES</span></p>
                    <p class="card__columns">50 <span class="column__description">USERS</span></p>
                    <p class="card__columns">8 <span class="column__description">STORAGE</span></p>
                </div>
            </header>
            <section class="card__package">
                <ul class="list">
                    <li class="list__features"><span class="list__text">Advanced automation</span></li>
                    <li class="list__features"><span class="list__text">Custom workflows</span></li>
                    <li class="list__features"><span class="list__text">White-label options</span></li>
                    <li class="list__features"><span class="list__text">Dedicated support</span></li>
                </ul>
            </section>
            <section class="card__buy">
                <a href="#" class="button button--primary">Vyzkoušejte zdarma</a>
            </section>
        </figure>
    </main>
</body>

</html>
